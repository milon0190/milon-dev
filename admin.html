<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<div class="auth" id="auth"><form class="box" id="login">

  <div class="fld"><label>Admin email</label><input id="u" type="email" autocomplete="username" required></div>
  <div class="fld"><label>Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <button class="btn p" style="width:100%">Log in</button>
</form></div>
<div id="app">
  <aside id="side"></aside>
  <main><h1 id="ttl"></h1><div id="view"></div></main>
</div>
<div class="mod" id="mod"><form class="box" id="mf"></form></div>
<div id="toast"></div>
